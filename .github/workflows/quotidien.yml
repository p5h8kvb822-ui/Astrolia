name: Astrolia - publication quotidienne

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Mode test (1 = oui)"
        default: "0"

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      DRY_RUN: ${{ github.event.inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Générer
        run: python main.py generer
      - name: Enregistrer les visuels
        run: |
          git config user.name "astrolia-bot"
          git config user.email "astrolia-bot@users.noreply.github.com"
          git add posts
          git diff --cached --quiet || git commit -m "Post du jour"
          git push
          sleep 20
      - name: Publier
        run: python main.py publier
      - name: Marquer publié
        run: |
          git add posts
          git diff --cached --quiet || git commit -m "Post publié"
          git push
